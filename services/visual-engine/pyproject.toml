[project]
name = "gnsis-visual"
version = "0.1.0"
description = "GNSIS visual System-1 decision engine and Browser Visual API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# E501: generated HTML/CSS fixtures; RUF001: intentional UI glyphs in synthetic pages.
ignore = ["E501", "RUF001", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["gnsis_visual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
